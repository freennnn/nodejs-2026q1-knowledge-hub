services:
  db:
    image: postgres:16-alpine
    # explicitly inject only those variable from (.env, whic is read by compose automatically)
    # instead of loading all the variables with env_file: .env as we do for the app service
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - knowledge_hub_net

  vectordb:
    image: qdrant/qdrant:v1.12.6
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:6333/readyz || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - knowledge_hub_net

  app:
    image: ${IMAGE_LOCAL_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      vectordb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # inside compose, use service DNS name instead of localhost
      RAG_VECTOR_DB_URL: http://vectordb:6333
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - knowledge_hub_net

  migrate:
    image: ${IMAGE_LOCAL_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: ['npx', 'prisma', 'migrate', 'deploy']
    restart: 'no'
    networks:
      - knowledge_hub_net

  seed:
    image: ${IMAGE_LOCAL_NAME}
    profiles: ['seed']
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    command: ['node', 'dist/prisma/seed.js']
    restart: 'no'
    networks:
      - knowledge_hub_net

  adminer:
    image: adminer
    profiles: ['debug']
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - knowledge_hub_net

networks:
  knowledge_hub_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
