services:
  db:
    image: postgres:16-alpine
    # explicitly inject only those variable from (.env, whic is read by compose automatically)
    # instead of loading all the variables with env_file: .env as we do for the app service
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_hub}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-knowledge_hub}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - knowledge_hub_net

  app:
    image: ${IMAGE_LOCAL_NAME}
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:4000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
    networks:
      - knowledge_hub_net

  adminer:
    image: adminer
    profiles: ['debug']
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    restart: unless-stopped
    networks:
      - knowledge_hub_net

networks:
  knowledge_hub_net:
    driver: bridge

volumes:
  postgres_data:
